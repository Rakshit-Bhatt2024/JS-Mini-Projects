<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <div class="search">
        <input
          type="text"
          id="search"
          placeholder="Enter city name"
          spellcheck="false"
        />
        <button><img src="images/search.png" /></button>
      </div>
      <div class="error">
        <p>Enter a valid city name</p>
      </div>
      <div class="weather">
        <img src="images/rain.png" class="weather-icon" />
        <h1 class="temp">22°C</h1>
        <h2 class="city">New York</h2>
        <div class="details">
          <div class="col">
            <img src="images/humidity.png" />
            <div>
              <p class="humidity">50%</p>
              <p>Humidity</p>
            </div>
          </div>
          <div class="col">
            <img src="images/wind.png" />
            <div>
              <p class="wind">15 km/hr</p>
              <p>Wind Speed</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="config.js"></script>
    <script>
      // Check if config is loaded
      if (typeof CONFIG === 'undefined') {
        console.error('Config file not loaded properly');
        alert('Configuration error: Please check if config.js file exists and is properly formatted.');
      }

      const apiKey = CONFIG.API_KEY;
      const apiUrl = CONFIG.API_URL;

      console.log('API configured successfully'); // Debug log

      const searchBox = document.querySelector(".search input");
      const searchBtn = document.querySelector(".search button");
      const weatherIcon = document.querySelector(".weather-icon");

      async function checkWeather(city) {
        if (!city.trim()) {
          document.querySelector(".error").style.display = "block";
          document.querySelector(".weather").style.display = "none";
          return;
        }

        try {
          const response = await fetch(apiUrl + city + `&appid=${apiKey}`);
          
          if (response.status === 404) {
            document.querySelector(".error").style.display = "block";
            document.querySelector(".weather").style.display = "none";
            return;
          } else if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          } else {
            var data = await response.json();

          document.querySelector(".temp").innerHTML =
            Math.round(data.main.temp) + "°C";
          document.querySelector(".city").innerHTML = data.name;
          document.querySelector(".humidity").innerHTML =
            data.main.humidity + "%";
          document.querySelector(".wind").innerHTML =
            data.wind.speed + " km/hr";

          if (data.weather[0].main === "Clouds") {
            weatherIcon.src = "images/clouds.png";
          } else if (data.weather[0].main === "Clear") {
            weatherIcon.src = "images/clear.png";
          } else if (data.weather[0].main === "Rain") {
            weatherIcon.src = "images/rain.png";
          } else if (data.weather[0].main === "Drizzle") {
            weatherIcon.src = "images/drizzle.png";
          } else if (data.weather[0].main === "Mist") {
            weatherIcon.src = "images/mist.png";
          } else if (data.weather[0].main === "Snow") {
            weatherIcon.src = "images/snow.png";
          }            document.querySelector(".weather").style.display = "block";
            document.querySelector(".error").style.display = "none";
          }
        } catch (error) {
          console.error('Error fetching weather data:', error);
          document.querySelector(".error").style.display = "block";
          document.querySelector(".weather").style.display = "none";
        }
      }

      searchBtn.addEventListener("click", () => {
        checkWeather(searchBox.value);
      });

      searchBox.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          checkWeather(searchBox.value);
        }
      });
    </script>
  </body>
</html>
